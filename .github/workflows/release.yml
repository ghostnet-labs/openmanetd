name: "Release"

on:
  push:
    tags:
      - "*"

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for all tags
          submodules: 'recursive'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Dependencies
        run: sudo apt update && sudo apt install -y build-essential libnl-3-dev libnl-genl-3-dev libgps-dev libcap-dev libopus-dev libopusfile-dev pkg-config portaudio19-dev batctl net-tools alfred iproute2 libhidapi-dev libusb-1.0-0-dev libudev-dev libpam0g-dev

      - name: Compile Alfred Go Bindings
        run: make alfred

      # static/ is not committed; //go:embed needs the built app.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build frontend
        run: make frontend

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args : release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
