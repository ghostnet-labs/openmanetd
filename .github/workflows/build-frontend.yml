name: "Build Frontend Assets"

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "static/**"
      - ".github/workflows/build-frontend.yml"

permissions:
  contents: read

# Cancel superseded PR runs so old heads stop holding the shared runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# static/ is no longer committed (two PRs that rebuilt it always conflicted).
# This only proves the PR's frontend builds; main's bundle is published by
# static-bundle.yml for the OpenWrt package build.
jobs:
  build-frontend:
    name: "Build static assets"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Fail if the PR commits built static/ files
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.base_ref }}
          tracked=$(git ls-files static | grep -v '^static/whisper/' || true)
          if [ -n "$tracked" ]; then
            echo "::error::static/ is built, not committed. Drop it with: git rm -r --cached static && git checkout origin/main -- static/whisper"
            echo "$tracked"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The Makefile target prunes stale hashed bundles before building and runs
      # the CSS target check; it is what static-bundle.yml runs on main.
      - name: Build frontend
        run: make frontend
