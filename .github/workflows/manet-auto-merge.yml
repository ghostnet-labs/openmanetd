name: Handle passing PRs
on:
  workflow_run:
    workflows: ["Manet merge gate","Build Frontend Assets","CodeQL Advanced","Frontend Tests","Go Tests","Frontend E2E"]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  pull_request_review:
    types: [submitted, dismissed]
  # Low-frequency fallback for dependencies and resolved conversations that
  # have no local CI event; check results and reviews above trigger it right
  # away, so this only catches what events miss.
  schedule:
    - cron: '4 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write
# A newer trigger replaces a queued or running sweep, so one run stuck waiting
# for a runner can never hold the group and starve every later run.
concurrency:
  group: manet-auto-merge
  cancel-in-progress: true
jobs:
  merge:
    name: Handle passing PRs
    # Self-hosted is safe here: pull_request_target runs only base-branch
    # workflow code, and this job never checks out or executes PR-head code
    # (it checks out a pinned docs commit and makes API calls).
    # Hosted on purpose: this job holds a write token, so it must not share a persistent
    # self-hosted runner with jobs that run PR code. Revisit with dedicated JIT runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ghostnet-labs/docs
          ref: 653380a58247c0e9dd6231627b13ecef7f69fcbe
          persist-credentials: false
      - name: Merge only eligible, protected PRs
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_TOKEN: ${{ secrets.MANET_UPDATE_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 project/scripts/merge_policy.py merge --repo "$REPO"
      - name: Fetch the stale-run tool
        if: always()
        uses: actions/checkout@v4
        with:
          repository: ghostnet-labs/docs
          ref: c970a132316efc30a842565c945b783d15e21fd7
          path: stale-run-tool
          sparse-checkout: tools/stale-runs
          persist-credentials: false
      # Clears this repo's own runs that are provably dead for a day: PR closed,
      # head superseded, or an unstarted push run on a moved or deleted branch.
      # Never holds up a merge, and never touches a current-head run of an open PR.
      - name: Cancel dead runs older than a day
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 stale-run-tool/tools/stale-runs/stale_runs.py --cancel --min-age-hours 24 --repos "${GITHUB_REPOSITORY#*/}"
