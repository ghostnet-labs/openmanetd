name: "Mesh simulation"
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "internal/batman-adv/**"
      - "internal/meshsim/**"
      - "internal/openmanet/server/handlers/mesh*.go"
      - "internal/openmanet/server/handlers/batctl_snapshot.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/mesh-sim.yml"

permissions:
  contents: read

# Cancel superseded PR runs so old heads stop holding runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mesh-sim:
    name: "Virtual mesh (batman-adv)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Install mesh tools and build dependencies
        # The topology test links openmanetd's handlers package, which needs
        # the same native libraries as the Go test workflow.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends batctl alfred nftables iputils-ping \
            build-essential libnl-3-dev libnl-genl-3-dev libgps-dev libcap-dev libopus-dev \
            libopusfile-dev pkg-config portaudio19-dev libhidapi-dev libusb-1.0-0-dev \
            libudev-dev libpam0g-dev
          sudo modprobe batman_adv

      - name: Show batman-adv support
        run: |
          batctl -v
          sudo batctl ra || true
          for algo in BATMAN_IV BATMAN_V; do
            sudo unshare -n sh -c "ip link add bat0 type batadv ra $algo && echo $algo supported" || echo "$algo NOT supported"
          done
          grep -i batman /boot/config-$(uname -r) || true

      - name: Compile Alfred Go Bindings
        run: make alfred

      - name: Build test binary
        run: go test -c -tags meshsim -o meshsim.test ./internal/meshsim

      - name: Run virtual mesh tests
        run: sudo MESHSIM_REQUIRE=1 ./meshsim.test -test.v -test.timeout 25m -test.parallel 8

  # BATMAN_V is the algorithm OpenMANET ships, and the hosted Azure kernel
  # lacks CONFIG_BATMAN_ADV_BATMAN_V, so the job above can only run
  # BATMAN_IV. This job runs the same suite on the Mac Studio's gh-ubuntu VM
  # (stock Ubuntu arm64 kernel) and fails if BATMAN_V is missing there.
  # Fork pull requests never reach the Mac; they fall back to hosted Ubuntu
  # and run without the BATMAN_V requirement.
  mesh-sim-batman-v:
    name: "Virtual mesh BATMAN_V (Mac Studio VM)"
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      # Fail in seconds, with a plain reason, when the VM cannot run the
      # suite at all: it needs passwordless sudo for network namespaces.
      - name: Check runner can run the mesh
        run: |
          uname -a
          if ! sudo -n true 2>/dev/null; then
            echo "::error::This runner has no passwordless sudo; the mesh tests need root for network namespaces and batman_adv."
            exit 1
          fi
          zgrep -h BATMAN /proc/config.gz 2>/dev/null || grep -h BATMAN "/boot/config-$(uname -r)" || true

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      # The VM's runners share one Linux user and home directory; give each
      # runner its own Go caches, as codeql.yml does.
      - name: Use per-runner Go caches
        if: runner.environment == 'self-hosted'
        run: |
          base="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/_go"
          {
            echo "GOPATH=$base/path"
            echo "GOMODCACHE=$base/path/pkg/mod"
            echo "GOCACHE=$base/build"
          } >>"$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      # Install only what is missing, so the shared VM is touched once.
      - name: Install mesh tools and build dependencies
        run: |
          pkgs="batctl alfred nftables iputils-ping build-essential libnl-3-dev libnl-genl-3-dev
            libgps-dev libcap-dev libopus-dev libopusfile-dev pkg-config portaudio19-dev
            libhidapi-dev libusb-1.0-0-dev libudev-dev libpam0g-dev"
          missing=""
          for p in $pkgs; do
            dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q "ok installed" || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "Installing:$missing"
            sudo apt-get update
            # shellcheck disable=SC2086 # word splitting is the point
            sudo apt-get install -y --no-install-recommends $missing
          fi
          sudo modprobe batman_adv

      - name: Show batman-adv support
        run: |
          batctl -v
          for algo in BATMAN_IV BATMAN_V; do
            sudo unshare -n sh -c "ip link add bat0 type batadv ra $algo && echo $algo supported" || echo "$algo NOT supported"
          done

      - name: Compile Alfred Go Bindings
        run: make alfred

      - name: Build test binary
        run: go test -c -tags meshsim -o meshsim.test ./internal/meshsim

      - name: Run virtual mesh tests
        env:
          MESHSIM_REQUIRE_ALGOS: ${{ runner.environment == 'self-hosted' && 'BATMAN_V' || '' }}
        run: sudo MESHSIM_REQUIRE=1 MESHSIM_REQUIRE_ALGOS="$MESHSIM_REQUIRE_ALGOS" ./meshsim.test -test.v -test.timeout 25m -test.parallel 8
