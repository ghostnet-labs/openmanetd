name: "Go Tests"
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "internal/**"
      - "cmd/**"
      - "proto/**"
      - "sqlc.yaml"
      - "buf.yaml"
      - "buf.gen.yaml"
      - ".github/workflows/test-go.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      # The Mac Studio VM's five runners share one Linux user and home
      # directory. Give each runner its own Go caches so concurrent jobs do
      # not unpack and read the same module cache at once.
      - name: Use per-runner Go caches
        run: |
          base="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/_go"
          {
            echo "GOPATH=$base/path"
            echo "GOMODCACHE=$base/path/pkg/mod"
            echo "GOCACHE=$base/build"
            echo "GOLANGCI_LINT_CACHE=$base/golangci-lint"
          } >>"$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Check build dependencies are installed
        # Preinstalled in the Mac Studio's Ubuntu VM: its runner user has no sudo.
        run: dpkg-query -W build-essential libnl-3-dev libnl-genl-3-dev libgps-dev libcap-dev libopus-dev libopusfile-dev pkg-config portaudio19-dev batctl net-tools alfred iproute2 libhidapi-dev libusb-1.0-0-dev libudev-dev libpam0g-dev >/dev/null

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          # The Mac Studio VM's five runners share one user, so golangci-lint's
          # lock file would make concurrent lint jobs fail.
          args: --allow-parallel-runners

  test:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 60
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      # The Mac Studio VM's five runners share one Linux user and home
      # directory. Give each runner its own Go caches so concurrent jobs do
      # not unpack and read the same module cache at once.
      - name: Use per-runner Go caches
        run: |
          base="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/_go"
          {
            echo "GOPATH=$base/path"
            echo "GOMODCACHE=$base/path/pkg/mod"
            echo "GOCACHE=$base/build"
            echo "GOLANGCI_LINT_CACHE=$base/golangci-lint"
          } >>"$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Check build dependencies are installed
        # Preinstalled in the Mac Studio's Ubuntu VM: its runner user has no sudo.
        run: dpkg-query -W build-essential libnl-3-dev libnl-genl-3-dev libgps-dev libcap-dev libopus-dev libopusfile-dev pkg-config portaudio19-dev batctl net-tools alfred iproute2 libhidapi-dev libusb-1.0-0-dev libudev-dev libpam0g-dev >/dev/null

      - name: Compile Alfred Go Bindings
        run: make alfred

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install Go Dependencies
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1

      - name: Run tests
        run: make test

      - name: Build daemon and check comms races
        run: |
          go build ./...
          go test -race -count=1 ./internal/comms/...

      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: golang, unit
          fail_ci_if_error: false
          report_type: coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration_test:
    name: "Integration tests"
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 60
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      # The Mac Studio VM's five runners share one Linux user and home
      # directory. Give each runner its own Go caches so concurrent jobs do
      # not unpack and read the same module cache at once.
      - name: Use per-runner Go caches
        run: |
          base="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/_go"
          {
            echo "GOPATH=$base/path"
            echo "GOMODCACHE=$base/path/pkg/mod"
            echo "GOCACHE=$base/build"
            echo "GOLANGCI_LINT_CACHE=$base/golangci-lint"
          } >>"$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Check build dependencies are installed
        # Preinstalled in the Mac Studio's Ubuntu VM: its runner user has no sudo.
        run: dpkg-query -W build-essential libnl-3-dev libnl-genl-3-dev libgps-dev libcap-dev libopus-dev libopusfile-dev pkg-config portaudio19-dev batctl net-tools alfred iproute2 libhidapi-dev libusb-1.0-0-dev libudev-dev libpam0g-dev >/dev/null

      - name: Compile Alfred Go Bindings
        run: make alfred

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install Go Dependencies
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1

      - name: Run integration tests
        run: make integration-test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: golang, integration
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  benchmark:
    name: "Benchmarks"
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 60
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      # The Mac Studio VM's five runners share one Linux user and home
      # directory. Give each runner its own Go caches so concurrent jobs do
      # not unpack and read the same module cache at once.
      - name: Use per-runner Go caches
        run: |
          base="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/_go"
          {
            echo "GOPATH=$base/path"
            echo "GOMODCACHE=$base/path/pkg/mod"
            echo "GOCACHE=$base/build"
            echo "GOLANGCI_LINT_CACHE=$base/golangci-lint"
          } >>"$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Check build dependencies are installed
        # Preinstalled in the Mac Studio's Ubuntu VM: its runner user has no sudo.
        run: dpkg-query -W build-essential libnl-3-dev libnl-genl-3-dev libgps-dev libcap-dev libopus-dev libopusfile-dev pkg-config portaudio19-dev batctl net-tools alfred iproute2 libhidapi-dev libusb-1.0-0-dev libudev-dev libpam0g-dev >/dev/null

      - name: Compile Alfred Go Bindings
        run: make alfred

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install Go Dependencies
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1

      - name: Run benchmarks
        run: make bench-comms
